<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;">
  <title>DashBill</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: "Segoe UI", -apple-system, Arial, sans-serif;
      user-select: none; cursor: default;
    }
    .card {
      width: 100%; height: 100%;
      background: #0a0a0a; color: #fff;
      border-radius: 10px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      position: relative; overflow: hidden;
      animation: in .25s ease-out;
    }
    @keyframes in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; } }

    .mark {
      width: 66px; height: 66px;
      border: 2px solid #fff; border-radius: 14px;
      display: grid; place-items: center;
      position: relative;
    }
    /* Three rising bars: the "dash" half of the name. */
    .bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; }
    .bars i {
      display: block; width: 6px; background: #fff; border-radius: 1px;
      animation: grow 1.4s ease-in-out infinite;
    }
    .bars i:nth-child(1) { height: 10px; animation-delay: 0s; }
    .bars i:nth-child(2) { height: 18px; animation-delay: .18s; }
    .bars i:nth-child(3) { height: 26px; animation-delay: .36s; }
    @keyframes grow {
      0%, 100% { transform: scaleY(.55); transform-origin: bottom; }
      50%      { transform: scaleY(1);   transform-origin: bottom; }
    }

    .name {
      font-size: 25px; font-weight: 600; letter-spacing: -.01em; line-height: 1;
    }
    .name span { font-weight: 300; }
    .tag {
      font-size: 9.5px; letter-spacing: .26em; text-transform: uppercase;
      color: #8a8a8a;
    }

    .progress {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      background: #1e1e1e; overflow: hidden;
    }
    .progress i {
      display: block; height: 100%; width: 38%; background: #fff;
      animation: slide 1.25s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(305%); }
    }

    .foot {
      position: absolute; bottom: 14px; left: 0; right: 0;
      text-align: center; font-size: 10px; color: #5e5e5e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"><div class="bars"><i></i><i></i><i></i></div></div>
    <div>
      <div class="name">Dash<span>Bill</span></div>
    </div>
    <div class="tag">Budget &middot; Projects &middot; Invoicing</div>
    <div class="foot">Starting up&hellip;</div>
    <div class="progress"><i></i></div>
  </div>
</body>
</html>
